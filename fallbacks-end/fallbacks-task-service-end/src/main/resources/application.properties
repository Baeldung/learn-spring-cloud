server.port=8080
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

spring.cloud.openfeign.circuitbreaker.enabled=true

resilience4j.circuitbreaker.configs.default.slidingWindowSize=5
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=2

resilience4j.circuitbreaker.configs.default.recordExceptions=feign.RetryableException,java.util.concurrent.TimeoutException
resilience4j.circuitbreaker.configs.default.ignoreExceptions=feign.FeignException.BadRequest

resilience4j.timelimiter.configs.default.timeoutDuration=2s
resilience4j.timelimiter.configs.default.cancelRunningFuture=true
