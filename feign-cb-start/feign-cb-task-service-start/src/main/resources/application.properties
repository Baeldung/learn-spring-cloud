server.port=8080
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

resilience4j.circuitbreaker.instances.notification-cb.slidingWindowSize=5
resilience4j.circuitbreaker.instances.notification-cb.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.notification-cb.failureRateThreshold=50
resilience4j.circuitbreaker.instances.notification-cb.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.notification-cb.permittedNumberOfCallsInHalfOpenState=2